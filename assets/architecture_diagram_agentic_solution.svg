<text x="60" y="576" font-size="13.5" font-weight="700" fill="#12263a">GOVERNANCE AND TRUST</text>
<text x="60" y="600" font-size="11.4" font-weight="700" fill="#12263a">Access</text>
<text x="60" y="618" font-size="10.7" fill="#5b6b7c">Unity Catalog grants to all four reviewers: workspace Admin,</text>
<text x="60" y="632" font-size="10.7" fill="#5b6b7c">USE CATALOG, USE SCHEMA + SELECT on raw, curated and</text>
<text x="60" y="646" font-size="10.7" fill="#5b6b7c">analytics, READ VOLUME, warehouse Can use, and Genie shared</text>
<text x="60" y="660" font-size="10.7" fill="#5b6b7c">only after the tables.</text>
<text x="588" y="600" font-size="11.4" font-weight="700" fill="#12263a">Version control</text>
<text x="588" y="618" font-size="10.7" fill="#5b6b7c">Every answer, table definition and check is a file in Git. The</text>
<text x="588" y="632" font-size="10.7" fill="#5b6b7c">workspace is a Git folder, not a notebook dump.</text>
<text x="1116" y="600" font-size="11.4" font-weight="700" fill="#12263a">Reproducibility</text>
<text x="1116" y="618" font-size="10.7" fill="#5b6b7c">Pipeline rebuilt from the two raw CSVs in a fresh workspace on</text>
<text x="1116" y="632" font-size="10.7" fill="#5b6b7c">2026-11-13. Headline figures reproduced to the cent.</text>
<rect x="44" y="680" width="1592" height="108" rx="5" fill="#fdf6f6" stroke="#d9a0a0" stroke-width="1.3"/>
<text x="60" y="704" font-size="13.5" font-weight="700" fill="#8c2f2f">STATED LIMIT   what the client view does not cover</text>
<text x="60" y="726" font-size="11.2" fill="#7a3b3b">1,232 of 5,000 projects, USD 187,440.1m of USD 742,558.7m approved and 25.2% of value, are Pending and carry no client_id. Because</text>
<text x="60" y="741.5" font-size="11.2" fill="#7a3b3b">their performance status is also NULL they score as perfectly clean, and an unlabelled NULL client row would otherwise top the</text>
<text x="60" y="757.0" font-size="11.2" fill="#7a3b3b">growth ranking. The client view therefore covers 3,768 projects and USD 555,118.6m, 74.8% of approved value, and every client-level</text>
<text x="60" y="772.5" font-size="11.2" fill="#7a3b3b">statement is scoped to that population.</text>
<text x="44" y="822" font-size="10.6" fill="#5b6b7c">Files: 01_data/01_load_and_prepare.sql  |  01_data/02_data_quality_checks.sql  |  01_data/04_analytics_layer.sql  |  04_answers/ws1-3  |  02_agent/build_agent.ipynb</text>
