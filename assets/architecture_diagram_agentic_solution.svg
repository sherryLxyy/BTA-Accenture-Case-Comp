<text x="1229" y="194" font-size="11.6" fill="#5b6b7c">Two sources: portfolio at project grain, client_score at</text>
<text x="1229" y="211.1" font-size="11.6" fill="#5b6b7c">client grain. Eight written rules pin the unit, the date</text>
<text x="1229" y="228.2" font-size="11.6" fill="#5b6b7c">window, the ECL formula and the NULL scope.</text>
<rect x="1216" y="272" width="420" height="148" rx="5" fill="#f0edf8" stroke="#9b8fc4" stroke-width="1.3"/>
<text x="1229" y="296" font-size="14" font-weight="700" fill="#12263a">Agent   orchestrator + guardrails</text>
<text x="1229" y="314" font-size="11.6" fill="#5b6b7c">The LLM chooses the tool. Tool 1 Genie (lookup). Tool 2 Risk</text>
<text x="1229" y="331.1" font-size="11.6" fill="#5b6b7c">Calculator (ECL). Tool 3 Client Analysis (score one</text>
<text x="1229" y="348.20000000000005" font-size="11.6" fill="#5b6b7c">relationship). Financial guardrails reject unsupported figures</text>
<text x="1229" y="365.30000000000007" font-size="11.6" fill="#5b6b7c">and every call is logged.</text>
