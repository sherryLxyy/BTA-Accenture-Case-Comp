<text x="1229" y="456" font-size="14" font-weight="700" fill="#12263a">Board outputs</text>
<text x="1229" y="474" font-size="11.6" fill="#5b6b7c">Named recommendation. Three-minute demo video. Every figure</text>
<text x="1229" y="491.1" font-size="11.6" fill="#5b6b7c">traceable to a SQL file.</text>
