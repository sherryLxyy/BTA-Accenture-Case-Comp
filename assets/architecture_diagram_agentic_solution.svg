<text x="849" y="331.1" font-size="11.6" fill="#5b6b7c">ECL = 60% x Past Due = USD 3,311.72m. Watchlist</text>
<text x="849" y="348.20000000000005" font-size="11.6" fill="#5b6b7c">carries no provision. Whole-book sensitivity: USD</text>
<text x="849" y="365.30000000000007" font-size="11.6" fill="#5b6b7c">7,596.21m.</text>
