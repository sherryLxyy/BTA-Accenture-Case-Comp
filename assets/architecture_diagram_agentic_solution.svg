<text x="345" y="194" font-size="12.0" fill="#5b6b7c">Volume /Volumes/ifc/raw/raw_files -&gt; read_files, multiLine=true</text>
<rect x="332" y="238" width="480" height="130" rx="5" fill="#e8f2ee" stroke="#7fae9c" stroke-width="1.3"/>
<text x="345" y="262" font-size="14" font-weight="700" fill="#12263a">ifc.curated   single read surface</text>
<text x="345" y="280" font-size="11.6" fill="#5b6b7c">projects (5,000) + monitoring (3,768) + portfolio (5,000 LEFT JOIN</text>
<text x="345" y="297.1" font-size="11.6" fill="#5b6b7c">keyed on project_url, never on project_number). Duplicate-column</text>
<text x="345" y="314.20000000000005" font-size="11.6" fill="#5b6b7c">renames, typed casts, range checks, column comments.</text>
