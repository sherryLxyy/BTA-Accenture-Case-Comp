<text x="345" y="422" font-size="11.6" fill="#5b6b7c">project_text_flags: regex signals behind Q13, Q24, Q25, Q26.</text>
<text x="345" y="439.1" font-size="11.6" fill="#5b6b7c">client_portfolio (400 rows): exposure, deployment, impairment and ECL</text>
<text x="345" y="456.20000000000005" font-size="11.6" fill="#5b6b7c">per client. client_score: percentile ranks plus attention_score and</text>
<text x="345" y="473.30000000000007" font-size="11.6" fill="#5b6b7c">growth_score.</text>
