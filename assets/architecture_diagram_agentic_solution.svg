<text x="849" y="456" font-size="11.6" fill="#5b6b7c">Percentile scoring, USD 5,000m materiality floor, 19</text>
<text x="849" y="473.1" font-size="11.6" fill="#5b6b7c">large clients. Two continue, one reduce, one review.</text>
